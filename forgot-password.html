<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recover your Sweet Shop account password.">
    <title>Forgot Password | Sweet Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-wrapper">
        <div class="decoration heart-one" aria-hidden="true">♥</div>
        <div class="decoration sparkle" aria-hidden="true">✦</div>
        <section class="login-card" aria-labelledby="recovery-title">
            <div class="login-icon" aria-hidden="true">✉</div>
            <header class="login-header">
                <p class="eyebrow">Account recovery</p>
                <h1 id="recovery-title">Forgot password?</h1>
                <p>Enter your seller email and we’ll prepare your recovery request.</p>
            </header>
            <form id="recoveryForm" novalidate>
                <div class="form-group">
                    <label for="recoveryEmail">Email address</label>
                    <div class="input-wrapper">
                        <span class="field-icon" aria-hidden="true">✉</span>
                        <input type="email" id="recoveryEmail" name="email" placeholder="seller@example.com" autocomplete="email" aria-describedby="recoveryEmailError">
                    </div>
                    <small class="error-message" id="recoveryEmailError"></small>
                </div>
                <button class="login-button" type="submit">Send recovery link <span aria-hidden="true">→</span></button>
                <div class="form-message" id="formMessage" role="status" aria-live="polite"></div>
            </form>
            <p class="signup-text"><a href="index.html">← Back to login</a></p>
        </section>
    </main>
    <script src="forgot-password.js"></script>
</body>
</html>
